<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loka — AI Offline</title>
<style>
:root{
  --bg:#07090f; --panel:rgba(18,22,34,.72); --panel2:rgba(28,34,50,.6);
  --line:rgba(120,140,190,.14); --txt:#e8ecf6; --dim:#8b93a8;
  --acc:#7c5cff; --acc2:#38bdf8; --ok:#34d399; --danger:#f87171;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:
  radial-gradient(1000px 500px at 85% -10%, rgba(124,92,255,.16), transparent 60%),
  radial-gradient(800px 400px at -10% 110%, rgba(56,189,248,.10), transparent 60%),
  var(--bg);
  color:var(--txt); font-family:'Segoe UI',system-ui,sans-serif; height:100dvh; display:flex; overflow:hidden}
/* SIDEBAR */
aside{width:270px; background:var(--panel); border-right:1px solid var(--line);
  backdrop-filter:blur(18px); display:flex; flex-direction:column; padding:18px 14px; flex-shrink:0}
.logo{display:flex; align-items:center; gap:10px; padding:4px 8px 16px}
.logo .dot{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--acc),var(--acc2));
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px}
.logo h1{font-size:17px; letter-spacing:.4px}
.logo small{display:block;color:var(--dim);font-size:10.5px;font-weight:400;letter-spacing:1.5px}
.newchat{border:1px solid var(--line); background:var(--panel2); color:var(--txt); border-radius:12px;
  padding:11px; font-size:13.5px; cursor:pointer; margin-bottom:14px}
.newchat:hover{border-color:var(--acc)}
.sect{font-size:10px; color:var(--dim); letter-spacing:2px; text-transform:uppercase; padding:6px 8px}
.hist{flex:1; overflow-y:auto}
.hist .item{padding:9px 10px; font-size:13px; color:var(--dim); border-radius:9px; cursor:pointer;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hist .item:hover{background:var(--panel2); color:var(--txt)}
.foot{font-size:10.5px; color:var(--dim); padding:10px 8px 0; border-top:1px solid var(--line)}
.foot b{color:var(--ok)}
/* MAIN */
main{flex:1; display:flex; flex-direction:column; min-width:0}
header{display:flex; align-items:center; gap:12px; padding:14px 22px; border-bottom:1px solid var(--line);
  background:rgba(10,13,20,.5); backdrop-filter:blur(14px)}
header .st{font-size:13px} header .st b{display:block; font-size:14.5px}
.pill{font-size:10.5px; color:var(--ok); border:1px solid rgba(52,211,153,.3); background:rgba(52,211,153,.08);
  padding:3px 9px; border-radius:99px}
#modelBtn{margin-left:auto; display:flex; align-items:center; gap:8px; border:1px solid var(--line);
  background:var(--panel2); color:var(--txt); padding:8px 14px; border-radius:11px; font-size:13px; cursor:pointer}
#modelBtn:hover{border-color:var(--acc)}
#chat{flex:1; overflow-y:auto; padding:26px 6%; display:flex; flex-direction:column; gap:18px}
.row{display:flex; gap:12px; max-width:780px; width:100%; margin:0 auto}
.row.me{flex-direction:row-reverse}
.av{width:32px;height:32px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px}
.row.ai .av{background:linear-gradient(135deg,var(--acc),var(--acc2))}
.row.me .av{background:rgba(139,147,168,.18)}
.bub{padding:13px 16px; border-radius:15px; font-size:14.5px; line-height:1.65; white-space:pre-wrap; word-break:break-word}
.row.ai .bub{background:var(--panel); border:1px solid var(--line); border-top-left-radius:5px}
.row.me .bub{background:linear-gradient(135deg,rgba(124,92,255,.28),rgba(56,189,248,.20));
  border:1px solid rgba(124,92,255,.25); border-top-right-radius:5px}
.typing{display:inline-flex; gap:4px; padding:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--dim);animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}
#composer{padding:14px 6% 20px}
.cbox{max-width:780px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;
  background:var(--panel); border:1px solid var(--line); border-radius:17px; padding:10px 12px; backdrop-filter:blur(16px)}
.cbox:focus-within{border-color:rgba(124,92,255,.5)}
textarea{flex:1; background:none; border:none; outline:none; color:var(--txt); font-size:14.5px;
  resize:none; font-family:inherit; max-height:130px; line-height:1.5; padding:6px 4px}
#send{width:38px;height:38px;border-radius:11px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--acc),var(--acc2)); color:#fff; font-size:16px; flex-shrink:0}
#send:disabled{opacity:.4}
/* MODEL SHEET */
#sheet{position:fixed; inset:0; background:rgba(4,6,10,.6); backdrop-filter:blur(6px);
  display:none; align-items:flex-end; justify-content:center; z-index:50}
#sheet.open{display:flex}
.card{background:#10141f; border:1px solid var(--line); border-radius:20px 20px 0 0; width:100%;
  max-width:560px; padding:20px 20px 30px; max-height:75dvh; overflow-y:auto}
.card h2{font-size:15px; margin-bottom:2px} .card p{font-size:12px; color:var(--dim); margin-bottom:14px}
.mopt{display:flex; align-items:center; gap:13px; padding:13px; border:1px solid var(--line); border-radius:14px;
  cursor:pointer; margin-bottom:9px; transition:.15s}
.mopt:hover{border-color:var(--acc)} .mopt.sel{border-color:var(--acc); background:rgba(124,92,255,.09)}
.mopt .ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.mopt b{font-size:14px; display:block} .mopt small{font-size:11.5px; color:var(--dim)}
.mopt .tag{margin-left:auto; font-size:10px; padding:3px 8px; border-radius:99px; flex-shrink:0}
.tag.on{color:var(--ok); border:1px solid rgba(52,211,153,.35); background:rgba(52,211,153,.08)}
.tag.dl{color:var(--acc2); border:1px solid rgba(56,189,248,.35); background:rgba(56,189,248,.08)}
.tag.no{color:var(--dim); border:1px solid var(--line)}
/* MOBILE */
#burger{display:none}
@media(max-width:760px){
  aside{position:fixed; z-index:40; height:100dvh; transform:translateX(-105%); transition:.25s}
  aside.open{transform:none}
  #burger{display:block; background:none; border:1px solid var(--line); color:var(--txt);
    width:36px;height:36px;border-radius:10px; font-size:16px; cursor:pointer}
  #chat{padding:20px 5%} #composer{padding:12px 5% 16px}
}
</style>
</head>
<body>
<aside id="side">
  <div class="logo"><div class="dot">L</div><h1>Loka<small>OFFLINE AI · TERKUNCI</small></h1></div>
  <button class="newchat" onclick="newChat()">＋ Percakapan baru</button>
  <div class="sect">Riwayat</div>
  <div class="hist" id="hist"></div>
  <div class="foot"><b>● Sandbox aktif</b> — tanpa internet, data tak pernah keluar perangkat</div>
</aside>
<main>
  <header>
    <button id="burger" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
    <div class="st"><b id="mName">Loka</b><span style="color:var(--dim);font-size:11.5px">Qwen2.5 · GGUF lokal</span></div>
    <span class="pill">100% OFFLINE</span>
    <button id="modelBtn">🧠 <span id="mLabel">tiny</span> ▾</button>
  </header>
  <div id="chat"></div>
  <div id="composer">
    <div class="cbox">
      <textarea id="inp" rows="1" placeholder="Tanya apa saja… (tetap offline)"></textarea>
      <button id="send">➤</button>
    </div>
  </div>
</main>
<div id="sheet">
  <div class="card">
    <h2>Pilih Model AI</h2>
    <p>Semua tersimpan lokal di perangkat. Model lebih besar = lebih pintar, butuh RAM lebih.</p>
    <div id="mlist"></div>
  </div>
</div>
<script>
const MODELS=[
 {key:'tiny',  name:'Qwen 0.5B · Tiny',  size:'491 MB', ram:'RAM 3 GB+', ico:'⚡', d:'Cepat & ringan — HP apa saja'},
 {key:'small', name:'Qwen 1.5B · Small', size:'986 MB', ram:'RAM 4 GB+', ico:'🎯', d:'Seimbang — paling disarankan'},
 {key:'medium',name:'Qwen 3B · Medium',  size:'2 GB',   ram:'RAM 6 GB+', ico:'🧠', d:'Pintar — HP kelas menengah'},
 {key:'smart', name:'Qwen 7B · Smart',   size:'4.7 GB', ram:'RAM 8 GB+', ico:'💎', d:'Terpintar — HP flagship'},
];
let model=localStorage.getItem('loka_model')||'tiny';
let hist=[[]], cur=0, busy=false;
const $=id=>document.getElementById(id);
function renderModels(){
  $('mlist').innerHTML=MODELS.map(m=>{
    const info=window.__MODELS_STATUS?.[m.key]||{};
    const tag=info.downloaded?(m.key===model?'<span class="tag on">AKTIF</span>':'<span class="tag dl">✓ terunduh</span>'):'<span class="tag no">belum unduh</span>';
    return `<div class="mopt ${m.key===model?'sel':''}" onclick="pick('${m.key}')">
      <div class="ico" style="background:linear-gradient(135deg,rgba(124,92,255,.25),rgba(56,189,248,.2))">${m.ico}</div>
      <div><b>${m.name}</b><small>${m.size} · ${m.ram} · ${info.downloaded?m.d:'unduh via: /unduh '+m.key}</small></div>${tag}</div>`;
  }).join('');
}
function pick(k){ model=k; localStorage.setItem('loka_model',k);
  fetch('/api/model',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:k})}).catch(()=>{});
  $('mLabel').textContent=k; $('sheet').classList.remove('open'); renderModels(); }
$('modelBtn').onclick=()=>{renderModels(); $('sheet').classList.add('open')};
$('sheet').onclick=e=>{if(e.target.id==='sheet')$('sheet').classList.remove('open')};
function addRow(role,text,typing){
  const d=document.createElement('div'); d.className='row '+(role==='me'?'me':'ai');
  d.innerHTML=`<div class="av">${role==='me'?'🧑':'L'}</div><div class="bub">${typing?'<span class="typing"><i></i><i></i><i></i></span>':''}</div>`;
  if(!typing)d.querySelector('.bub').textContent=text;
  $('chat').appendChild(d); $('chat').scrollTop=1e9; return d.querySelector('.bub');
}
function newChat(){hist.push([]); cur=hist.length-1; $('chat').innerHTML=''; renderHist();}
function renderHist(){ $('hist').innerHTML=hist.map((h,i)=>{
  const t=h[0]?.c||'Kosong'; return `<div class="item" onclick="cur=${i};$('chat').innerHTML='';h.forEach(m=>addRow(m.r,m.c))">${t.slice(0,34)}</div>`}).join('');}
async function send(){
  if(busy)return; const q=$('inp').value.trim(); if(!q)return;
  $('inp').value=''; $('inp').style.height='auto'; busy=true; $('send').disabled=true;
  addRow('me',q); hist[cur].push({r:'me',c:q});
  const bub=addRow('ai','','typing');
  try{
    const r=await fetch('/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'local',messages:hist[cur].filter(m=>m.r).map(m=>({role:m.r==='me'?'user':'assistant',content:m.c})),stream:false})});
    const j=await r.json(); const ans=j.choices?.[0]?.message?.content||'(kosong)';
    bub.textContent=ans; hist[cur].push({r:'ai',c:ans});
  }catch(e){ bub.textContent='⚠ Tidak terhubung ke engine lokal. Jalankan: bash android/run.sh'; }
  busy=false; $('send').disabled=false; renderHist();
}
$('send').onclick=send;
$('inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
$('inp').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(130,e.target.scrollHeight)+'px'});
fetch('/api/models').then(r=>r.json()).then(j=>{window.__MODELS_STATUS=j; renderModels();}).catch(()=>{});
renderModels(); renderHist();
if(hist[0].length===0){ addRow('ai','Halo Paduka 👋 Aku Loka — AI-mu yang 100% offline. Semua model tersimpan di HP ini dan tidak ada data yang keluar. Coba tanya sesuatu!'); }
</script>
</body>
</html>
